# Bronze ingestor stack.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ingestor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required (set in .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required (set in .env)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required (set in .env)}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  ingestor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: api-football-ingestor:latest
    container_name: ingestor
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # When running inside the compose network, talk to postgres by service name.
      DB_DSN: ${DB_DSN_OVERRIDE:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
    # Run ingestor on-demand via `docker compose run --rm ingestor ...`.
    # The default profile keeps it from auto-starting with `docker compose up`.
    profiles: ["cli"]

  scheduler:
    # Lightweight Alpine cron that triggers the ingestor daily at 07:00 in $TZ.
    # Runs as a long-lived service: `docker compose up -d scheduler`
    # Change the cron expression to adjust the schedule.
    # docker:cli ships with docker + compose plugin + tzdata already installed,
    # so the container does not need internet at startup (Alpine repos sometimes
    # blocked by Docker Desktop DNS).
    image: docker:27-cli
    container_name: ingestor-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:ro
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-api-football-ingestor}
      TZ: ${TZ:-UTC}
    env_file:
      - path: .env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache tzdata > /dev/null 2>&1
        cp /usr/share/zoneinfo/$$TZ /etc/localtime 2>/dev/null || true
        echo "$$TZ" > /etc/timezone
        mkdir -p /var/log && touch /var/log/ingest.log
        # Write the crontab (0 7 * * * = 07:00 daily, in $TZ).
        # No --season flag: the runner rides whatever the API marks current per league.
        # --build rebuilds the ingestor image from the /workspace source before each
        # run, so a code change can never leave the 7am run on a stale image
        # (anti-drift, task 0008). Build output shares the same log redirect.
        echo '0 7 * * * docker compose -f /workspace/docker-compose.yml run --build --rm ingestor ingest >> /var/log/ingest.log 2>&1' \
          | crontab -
        crond -f -l 6
    profiles: ["scheduler"]

volumes:
  pgdata:
