[project]
name = "api-football-ingestor"
version = "0.1.0"
description = "Bronze-layer ingestor for API-Football (medallion architecture)."
requires-python = ">=3.12"
dependencies = [
    "httpx==0.27.2",
    "tenacity==9.0.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.7.0",
    "structlog==24.4.0",
    "psycopg2-binary==2.9.9",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-mock==3.14.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-python-dateutil==2.9.0.20240906",
]

[project.scripts]
ingestor = "ingestor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["psycopg2", "psycopg2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
